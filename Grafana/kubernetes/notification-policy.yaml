apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
    name: shoehub-notification-policy
    namespace: monitoring
spec:
    instanceSelector:
        matchLabels:
            dashboards: grafana
    route:
        receiver: Mahmoud Abuelnaga's Email
        group_by:
            - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
        routes:
            - receiver: Mahmoud Abuelnaga's Email
              object_matchers:
                  - - team
                    - =
                    - tech
              routes:
                  - receiver: Mahmoud Abuelnaga's Email
                    continue: true
                    object_matchers:
                        - - severity
                          - =
                          - warning
                  - receiver: ShoeHub Slack
                    continue: true
                    object_matchers:
                        - - severity
                          - =
                          - warning
