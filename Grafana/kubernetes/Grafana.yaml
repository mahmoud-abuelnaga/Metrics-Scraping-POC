apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
    name: grafana
    namespace: monitoring
    labels:
        dashboards: grafana
spec:
    config:
        log:
            mode: console
        security:
            admin_user: admin
            admin_password: admin

        smtp:
            enabled: "true"
            host: sandbox.smtp.mailtrap.io:587
            user: $__env{GF_SMTP_USER}
            password: $__env{GF_SMTP_PASSWORD}
            from_address: alerts@example.com
            from_name: Grafana Alerts
            startTLS_policy: OpportunisticStartTLS

        database:
            type: postgres
            host: grafana-db-rw.database.svc.cluster.local:5432
            name: grafana
            user: grafana
            password: grafana
            ssl_mode: disable

        plugins:
            preinstall_auto_update: "false"
            preinstall_disabled: "false"
            preinstall_sync: victoriametrics-metrics-datasource,grafana-lokiexplore-app

        dataproxy:
          timeout: "300"
          keep_alive_seconds: "300"

    deployment:
        spec:
            template:
                spec:
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 472
                        fsGroup: 472
                        fsGroupChangePolicy: OnRootMismatch
                    containers:
                        - name: grafana
                          envFrom:
                              - secretRef:
                                    name: grafana-smtp
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                              privileged: false
                              readOnlyRootFilesystem: false
                              runAsNonRoot: true
                              runAsUser: 472
                              runAsGroup: 472

                          startupProbe:
                              httpGet:
                                  path: /api/health
                                  port: 3000
                              initialDelaySeconds: 30
                              periodSeconds: 10
                              failureThreshold: 10
                              successThreshold: 1

                          readinessProbe:
                              httpGet:
                                  path: /api/health
                                  port: 3000
                              periodSeconds: 10
                              failureThreshold: 3
                              successThreshold: 1

                          livenessProbe:
                              httpGet:
                                  path: /api/health
                                  port: 3000
                              periodSeconds: 10
                              failureThreshold: 3
                              successThreshold: 1
