apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
    name: shoehub-payment-alerts
    namespace: monitoring
spec:
    instanceSelector:
        matchLabels:
            dashboards: grafana
    folderRef: shoehub-folder
    name: 1m Evaluation Group
    interval: 1m
    rules:
        - uid: payment-going-below-threshold
          title: Payment Going below threshold
          condition: C
          for: 2m
          keepFiringFor: 2m
          noDataState: Alerting
          execErrState: Error
          isPaused: false
          annotations:
              summary: Payment of {{ $labels.PaymentMethod }} is dropping below 2000
          data:
              - refId: A
                datasourceUid: VictoriaMetrics
                relativeTimeRange:
                    from: 600
                    to: 0
                model:
                    refId: A
                    datasource:
                        type: prometheus
                        uid: VictoriaMetrics
                    editorMode: code
                    expr: sum by (PaymentMethod) (shoehub_payments)
                    instant: true
                    range: false
                    intervalMs: 1000
                    maxDataPoints: 1
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                    from: 0
                    to: 0
                model:
                    refId: B
                    datasource:
                        type: __expr__
                        uid: __expr__
                    type: reduce
                    expression: A
                    reducer: last
                    intervalMs: 1000
                    maxDataPoints: 1
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                    from: 0
                    to: 0
                model:
                    refId: C
                    datasource:
                        type: __expr__
                        uid: __expr__
                    type: threshold
                    expression: B
                    conditions:
                        - type: query
                          query:
                              params:
                                  - C
                          reducer:
                              type: last
                              params: []
                          evaluator:
                              type: lt
                              params:
                                  - 2000
                          operator:
                              type: and
                    intervalMs: 1000
                    maxDataPoints: 1
