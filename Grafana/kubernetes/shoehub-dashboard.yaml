apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
    name: shoehub-dashboard
    namespace: monitoring
spec:
    instanceSelector:
        matchLabels:
            dashboards: grafana
    # This is the Kubernetes name of the GrafanaFolder CR above.
    folderRef: shoehub-folder
    uid: shoehub-dashboard
    json: |
        {
            "title": "ShoeHub Dashboard",
            "uid": "shoehub-dashboard",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "30s",
            "time": {
                "from": "now-6h",
                "to": "now"
            },
            "panels": [
                {
                    "id": 1,
                    "type": "timeseries",
                    "title": "Request Duration 95th percentile",
                    "transparent": true,
                    "datasource": {
                        "type": "prometheus",
                        "uid": "VictoriaMetrics"
                    },
                    "gridPos": {
                        "h": 8,
                        "w": 24,
                        "x": 0,
                        "y": 0
                    },
                    "fieldConfig": {
                        "defaults": {
                            "custom": {
                                "drawStyle": "line",
                                "lineInterpolation": "linear",
                                "barAlignment": 0,
                                "lineWidth": 1,
                                "fillOpacity": 0,
                                "gradientMode": "none",
                                "spanNulls": false,
                                "insertNulls": false,
                                "showPoints": "auto",
                                "pointSize": 5,
                                "stacking": {
                                    "mode": "none",
                                    "group": "A"
                                },
                                "axisPlacement": "auto",
                                "axisLabel": "",
                                "axisColorMode": "text",
                                "axisBorderShow": false,
                                "scaleDistribution": {
                                    "type": "linear"
                                },
                                "axisCenteredZero": false,
                                "hideFrom": {
                                    "tooltip": false,
                                    "viz": false,
                                    "legend": false
                                },
                                "thresholdsStyle": {
                                    "mode": "off"
                                }
                            },
                            "color": {
                                "mode": "palette-classic"
                            },
                            "mappings": [],
                            "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                    {
                                        "color": "green",
                                        "value": null
                                    },
                                    {
                                        "color": "red",
                                        "value": 80
                                    }
                                ]
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "tooltip": {
                            "mode": "single",
                            "sort": "none"
                        },
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom",
                            "calcs": []
                        }
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": "VictoriaMetrics"
                            },
                            "editorMode": "code",
                            "expr": "histogram_quantile(0.95, sum(increase(microsoft_aspnetcore_hosting_http_server_request_duration_bucket{service=\"shoehub-service\"}[5m])) by (le))",
                            "legendFormat": "Request Duration 95th percentile",
                            "instant": false,
                            "range": true,
                            "exemplar": false
                        }
                    ]
                },
                {
                    "id": 2,
                    "type": "timeseries",
                    "title": "Sales by Shoe Type",
                    "transparent": true,
                    "datasource": {
                        "type": "prometheus",
                        "uid": "VictoriaMetrics"
                    },
                    "gridPos": {
                        "h": 8,
                        "w": 24,
                        "x": 0,
                        "y": 8
                    },
                    "fieldConfig": {
                        "defaults": {
                            "custom": {
                                "drawStyle": "line",
                                "lineInterpolation": "linear",
                                "barAlignment": 0,
                                "lineWidth": 1,
                                "fillOpacity": 0,
                                "gradientMode": "none",
                                "spanNulls": false,
                                "insertNulls": false,
                                "showPoints": "auto",
                                "pointSize": 5,
                                "stacking": {
                                    "mode": "none",
                                    "group": "A"
                                },
                                "axisPlacement": "auto",
                                "axisLabel": "",
                                "axisColorMode": "text",
                                "axisBorderShow": false,
                                "scaleDistribution": {
                                    "type": "linear"
                                },
                                "axisCenteredZero": false,
                                "hideFrom": {
                                    "tooltip": false,
                                    "viz": false,
                                    "legend": false
                                },
                                "thresholdsStyle": {
                                    "mode": "off"
                                }
                            },
                            "color": {
                                "mode": "palette-classic"
                            },
                            "mappings": [],
                            "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                    {
                                        "color": "green",
                                        "value": null
                                    },
                                    {
                                        "color": "red",
                                        "value": 80
                                    }
                                ]
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "tooltip": {
                            "mode": "single",
                            "sort": "none"
                        },
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom",
                            "calcs": []
                        }
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": "VictoriaMetrics"
                            },
                            "editorMode": "code",
                            "expr": "sum by(ShoeType) (increase(shoehub_sales[5m]))",
                            "legendFormat": "{{ShoeType}}",
                            "instant": false,
                            "range": true,
                            "exemplar": false
                        }
                    ],
                    "transformations": [
                        {
                            "id": "calculateField",
                            "options": {
                                "alias": "Total Sales",
                                "mode": "reduceRow",
                                "reduce": {
                                    "reducer": "sum"
                                },
                                "replaceFields": false
                            }
                        }
                    ]
                },
                {
                    "id": 3,
                    "type": "piechart",
                    "title": "Payment Method Contribution to Total Revenue",
                    "transparent": true,
                    "datasource": {
                        "type": "prometheus",
                        "uid": "VictoriaMetrics"
                    },
                    "gridPos": {
                        "h": 8,
                        "w": 24,
                        "x": 0,
                        "y": 16
                    },
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic"
                            },
                            "mappings": [],
                            "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                    {
                                        "color": "green",
                                        "value": null
                                    },
                                    {
                                        "color": "red",
                                        "value": 80
                                    }
                                ]
                            }
                        },
                        "overrides": []
                    },
                    "options": {
                        "reduceOptions": {
                            "values": false,
                            "calcs": [
                                "lastNotNull"
                            ],
                            "fields": ""
                        },
                        "pieType": "donut",
                        "displayLabels": [
                            "name",
                            "percent"
                        ],
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom",
                            "calcs": [
                                "percent"
                            ]
                        },
                        "tooltip": {
                            "mode": "single",
                            "sort": "none"
                        }
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": "VictoriaMetrics"
                            },
                            "editorMode": "code",
                            "expr": "sum by (PaymentMethod) (shoehub_payments)",
                            "legendFormat": "{{PaymentMethod}}",
                            "instant": true,
                            "range": false,
                            "exemplar": false
                        }
                    ]
                },
                {
                    "id": 4,
                    "type": "barchart",
                    "title": "Current Sales vs Last 5 mins",
                    "transparent": true,
                    "datasource": {
                        "type": "prometheus",
                        "uid": "VictoriaMetrics"
                    },
                    "gridPos": {
                        "h": 8,
                        "w": 24,
                        "x": 0,
                        "y": 24
                    },
                    "fieldConfig": {
                        "defaults": {
                            "color": {
                                "mode": "palette-classic"
                            },
                            "custom": {
                                "axisBorderShow": false,
                                "axisCenteredZero": false,
                                "axisColorMode": "text",
                                "axisLabel": "",
                                "axisPlacement": "auto",
                                "fillOpacity": 80,
                                "gradientMode": "none",
                                "hideFrom": {
                                    "legend": false,
                                    "tooltip": false,
                                    "viz": false
                                },
                                "lineWidth": 1,
                                "scaleDistribution": {
                                    "type": "linear"
                                },
                                "thresholdsStyle": {
                                    "mode": "off"
                                }
                            },
                            "mappings": [],
                            "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                    {
                                        "color": "green",
                                        "value": null
                                    },
                                    {
                                        "color": "red",
                                        "value": 80
                                    }
                                ]
                            }
                        },
                        "overrides": [
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "Value #A"
                                },
                                "properties": [
                                    {
                                        "id": "displayName",
                                        "value": "Current 5m"
                                    },
                                    {
                                        "id": "color",
                                        "value": {
                                            "fixedColor": "green",
                                            "mode": "fixed"
                                        }
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "Value #B"
                                },
                                "properties": [
                                    {
                                        "id": "displayName",
                                        "value": "Previous 5m"
                                    },
                                    {
                                        "id": "color",
                                        "value": {
                                            "fixedColor": "yellow",
                                            "mode": "fixed"
                                        }
                                    }
                                ]
                            },
                            {
                                "matcher": {
                                    "id": "byName",
                                    "options": "Difference"
                                },
                                "properties": [
                                    {
                                        "id": "color",
                                        "value": {
                                            "fixedColor": "blue",
                                            "mode": "fixed"
                                        }
                                    }
                                ]
                            }
                        ]
                    },
                    "options": {
                        "orientation": "auto",
                        "xTickLabelRotation": 0,
                        "xTickLabelSpacing": 0,
                        "showValue": "auto",
                        "stacking": "none",
                        "groupWidth": 0.7,
                        "barWidth": 0.97,
                        "barRadius": 0,
                        "fullHighlight": false,
                        "legend": {
                            "showLegend": true,
                            "displayMode": "list",
                            "placement": "bottom",
                            "calcs": []
                        },
                        "tooltip": {
                            "mode": "single",
                            "sort": "none"
                        }
                    },
                    "targets": [
                        {
                            "refId": "A",
                            "datasource": {
                                "type": "prometheus",
                                "uid": "VictoriaMetrics"
                            },
                            "editorMode": "code",
                            "expr": "sum by (ShoeType) (increase(shoehub_sales{service=\"shoehub-service\"}[5m]))",
                            "format": "table",
                            "instant": true,
                            "range": false,
                            "legendFormat": "{{ShoeType}} - now",
                            "exemplar": false
                        },
                        {
                            "refId": "B",
                            "datasource": {
                                "type": "prometheus",
                                "uid": "VictoriaMetrics"
                            },
                            "editorMode": "code",
                            "expr": "sum by (ShoeType) (increase(shoehub_sales{service=\"shoehub-service\"}[5m] offset 5m))",
                            "format": "table",
                            "instant": true,
                            "range": false,
                            "legendFormat": "{{ShoeType}} - 5 mins",
                            "exemplar": false
                        }
                    ],
                    "transformations": [
                        {
                            "id": "joinByField",
                            "options": {
                                "byField": "ShoeType",
                                "mode": "inner"
                            }
                        },
                        {
                            "id": "calculateField",
                            "options": {
                                "alias": "Difference",
                                "binary": {
                                    "left": "Value #A",
                                    "operator": "-",
                                    "right": "Value #B"
                                },
                                "mode": "binary",
                                "replaceFields": false
                            }
                        }
                    ]
                }
            ],
            "templating": {
                "list": []
            },
            "annotations": {
                "list": [
                    {
                        "builtIn": 1,
                        "datasource": {
                            "type": "grafana",
                            "uid": "-- Grafana --"
                        },
                        "enable": true,
                        "hide": true,
                        "iconColor": "rgba(0, 211, 255, 1)",
                        "name": "Annotations & Alerts",
                        "type": "dashboard"
                    }
                ]
            }
        }
