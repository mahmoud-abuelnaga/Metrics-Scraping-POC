apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
    name: loki
    namespace: monitoring
spec:
    instanceSelector:
        matchLabels:
            dashboards: grafana

    datasource:
        name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local:80
        isDefault: false
        editable: false
