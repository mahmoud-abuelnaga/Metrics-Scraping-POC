apiVersion: apps/v1
kind: Deployment
metadata:
    name: shoehub-app
    namespace: production
    labels:
        app.kubernetes.io/name: shoehub-app
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: shoehub-app

    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0

    template:
        metadata:
            labels:
                app.kubernetes.io/name: shoehub-app
        spec:
            containers:
                - name: shoehub-app
                  image: aussiearef/shoehub:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8080
                        name: http
                        protocol: TCP
                  resources:
                      requests:
                          memory: 256Mi
                          cpu: 125m
                      limits:
                          memory: 512Mi
                          cpu: 250m
