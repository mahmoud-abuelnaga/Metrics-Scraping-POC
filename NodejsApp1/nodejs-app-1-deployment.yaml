apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app-1
  namespace: production
  labels:
    app.kubernetes.io/name: nodejs-app-1
    app.kubernetes.io/version: ${IMAGE_TAG}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nodejs-app-1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodejs-app-1
        app.kubernetes.io/version: ${IMAGE_TAG}

    spec:
      containers:
        - name: nodejs-app-1
          image: abuelnaga0/nodejs-app-1:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

            - containerPort: 9464
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: 256Mi
              cpu: 125m
            limits:
              memory: 512Mi
              cpu: 250m

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "3000"

            - name: LOG_LEVEL
              value: "info"

            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']

            - name: OTEL_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']

            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://tempo-distributor.monitoring.svc.cluster.local:4318/v1/traces"

            - name: OTEL_SERVICE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"

            - name: PROMETHEUS_HOST
              value: "0.0.0.0"

            - name: OTEL_PROMETHEUS_PORT
              value: "9464"

            - name: PROMETHEUS_ENDPOINT
              value: "/metrics"

            # Must currently be numeric seconds, not "10s".
            - name: SHUTDOWN_GRACE_PERIOD
              value: "10"
