# Redpanda is the Kafka-compatible durable write buffer required by Tempo 3.
# This is intentionally a single-broker development configuration for Kind.

fullnameOverride: tempo-kafka

console:
  enabled: false

external:
  enabled: false
  service:
    enabled: false

tls:
  enabled: false

statefulset:
  replicas: 1
  podAntiAffinity:
    type: soft

resources:
  cpu:
    cores: 1
    overprovisioned: true
  memory:
    container:
      min: 2Gi
      max: 2Gi

storage:
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path

listeners:
  schemaRegistry:
    enabled: false
  http:
    enabled: false

config:
  cluster:
    auto_create_topics_enabled: true
    default_topic_replications: 1
    internal_topic_replication_factor: 1

monitoring:
  enabled: true
  scrapeInterval: 30s

logging:
  usageStats:
    enabled: false

# Avoid privileged tuning containers in the local Kind environment.
tuning:
  tune_aio_events: false
