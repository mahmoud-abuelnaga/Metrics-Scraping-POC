apiVersion: v1
kind: Service
metadata:
    name: seaweedfs
    namespace: database
spec:
    selector:
        kubernetes.io/name: seaweedfs
    ports:
        - name: s3
          port: 8333
          targetPort: s3
        - name: master
          port: 9333
          targetPort: master
        - name: filer
          port: 8888
          targetPort: filer
        - name: admin
          port: 23646
          targetPort: admin
